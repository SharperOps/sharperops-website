name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two production deploys overlap; queue them instead of cancelling,
# so an in-flight upload is always allowed to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Emits dist/client (static assets, incl. public/) and dist/server,
      # plus the .wrangler/deploy/config.json that points wrangler at them.
      - name: Build
        run: bun run build

      # Uses the lockfile-pinned wrangler rather than a separately installed
      # one, so CI deploys with the same version as local.
      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
