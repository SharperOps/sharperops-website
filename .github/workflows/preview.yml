name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One preview build per PR. Unlike production, cancelling is fine here: an
# outdated preview has no value once a newer commit is pushed.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Build and upload preview version
    # Secrets are not exposed to pull requests from forks, so the upload would
    # fail. Branches pushed to this repo are unaffected.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # `versions upload` uploads a new Worker version and gives it a preview
      # URL, but does NOT shift any production traffic — sharperops.com keeps
      # serving whatever `wrangler deploy` last put there.
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          bunx wrangler versions upload --preview-alias "$ALIAS" 2>&1 | tee upload.log
          # Prefer the stable per-PR alias URL over the per-version one, so the
          # link in the PR comment stays valid as new commits are pushed.
          url=$(grep -oE "https://${ALIAS}-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          if [ -z "$url" ]; then
            url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' upload.log | head -1)
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not find a preview URL in the wrangler output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --edit-last keeps one comment per PR instead of one per push.
          cat > comment.md <<MD
          **Preview:** $URL

          Built from \`${SHA:0:7}\`. This comment is updated on every push.

          Heads up: previews run against the *production* Worker secrets, so
          submitting the contact form sends real email.
          MD
          gh pr comment "$PR" --edit-last --create-if-none --body-file comment.md
